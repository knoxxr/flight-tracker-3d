<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroGlobe 3D — 전 세계 실시간 항공기 추적기</title>
  <meta name="description" content="전 세계 항공기의 실시간 위치를 3D 지구본 위에서 추적하고 고도, 속도, 항로, 기체 정보를 확인하는 실시간 항공 추적 시스템" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell" id="app-shell">
    <!-- Fullscreen 3D Globe Canvas -->
    <div class="globe-stage" id="globe-stage">
      <canvas id="globe-canvas" aria-label="전 세계 항공기 3D 실시간 지도"></canvas>
    </div>

    <!-- Top-Left Command & Search Bar -->
    <header class="hud-top-left" aria-label="항공기 검색 및 상태">
      <div class="brand-row">
        <div class="brand-title-group">
          <h1 class="brand-title">AeroGlobe 3D</h1>
          <span class="utc-clock" id="utc-clock">--:--:-- UTC</span>
        </div>
        <div class="mode-switch" role="group" aria-label="데이터 소스 선택">
          <button type="button" class="mode-btn active" id="mode-auto" data-mode="auto" title="OpenSky 실시간 우선, 불가 시 시뮬레이션 자동 전환">AUTO</button>
          <button type="button" class="mode-btn" id="mode-live" data-mode="live" title="OpenSky Network 실시간 ADS-B">LIVE</button>
          <button type="button" class="mode-btn" id="mode-sim" data-mode="simulation" title="글로벌 대권 항로 물리 시뮬레이션">SIM</button>
        </div>
      </div>

      <div class="status-strip">
        <span class="source-indicator" id="source-indicator">
          <span class="status-dot" id="status-dot"></span>
          <span id="source-label">연결 중...</span>
        </span>
        <span class="metric-inline">
          추적 중 <strong id="flight-count">0</strong>대
        </span>
      </div>

      <div class="search-box">
        <input
          type="search"
          id="flight-search"
          placeholder="편명, 항공사, 공항코드 (예: KAL, ICN, LHR, JFK)"
          autocomplete="off"
          aria-label="항공편 검색"
        />
        <button type="button" class="list-toggle-btn" id="toggle-list-btn" title="항공편 목록 열기">목록</button>
      </div>

      <p class="fallback-notice hidden" id="fallback-notice"></p>
    </header>

    <!-- Bottom-Left Camera Presets & Layer Toggles -->
    <nav class="hud-bottom-left" aria-label="지역 카메라 및 지도 레이어">
      <div class="preset-group" id="region-presets">
        <button type="button" class="chip-btn active" data-lat="32" data-lon="126" data-zoom="1.35">한국 · 동아시아</button>
        <button type="button" class="chip-btn" data-lat="20" data-lon="20" data-zoom="1.05">전 세계</button>
        <button type="button" class="chip-btn" data-lat="49" data-lon="10" data-zoom="1.95">유럽</button>
        <button type="button" class="chip-btn" data-lat="38" data-lon="-96" data-zoom="1.65">북미</button>
        <button type="button" class="chip-btn" data-lat="25" data-lon="52" data-zoom="2.0">중동</button>
        <button type="button" class="chip-btn" data-lat="44" data-lon="-40" data-zoom="1.45">북대서양</button>
        <button type="button" class="chip-btn" data-lat="34" data-lon="-168" data-zoom="1.25">태평양</button>
      </div>
      <div class="layer-group">
        <button type="button" class="toggle-btn active" id="toggle-rotate">자동 회전</button>
        <button type="button" class="toggle-btn active" id="toggle-daynight">밤/낮 그림자</button>
        <button type="button" class="toggle-btn active" id="toggle-trails">비행 궤적</button>
        <button type="button" class="toggle-btn active" id="toggle-airports">공항 허브</button>
        <button type="button" class="toggle-btn" id="zoom-in-btn" aria-label="확대">+</button>
        <button type="button" class="toggle-btn" id="zoom-out-btn" aria-label="축소">−</button>
      </div>
    </nav>

    <!-- Bottom-Right Altitude Color Legend -->
    <aside class="hud-bottom-right" aria-label="고도별 색상 범례">
      <span class="legend-title">고도 (FT)</span>
      <div class="legend-items">
        <span class="legend-item"><i class="swatch" style="background:#4ade80"></i>&lt;15k</span>
        <span class="legend-item"><i class="swatch" style="background:#2dd4bf"></i>15-28k</span>
        <span class="legend-item"><i class="swatch" style="background:#38bdf8"></i>28-37k</span>
        <span class="legend-item"><i class="swatch" style="background:#fbbf24"></i>37k+</span>
      </div>
    </aside>

    <!-- Right Slide-in Panel: Flight List OR Flight Inspector -->
    <aside class="hud-right hidden" id="side-panel" aria-label="항공기 상세 정보 및 목록">
      <!-- Flight List View -->
      <section id="flight-list-view" class="panel-section hidden">
        <div class="panel-header">
          <div>
            <h2 class="panel-title">실시간 항공편</h2>
            <p class="panel-subtitle" id="list-subtitle">상위 항공편 표시 중</p>
          </div>
          <button type="button" class="icon-close-btn" id="close-list-btn" aria-label="닫기">×</button>
        </div>
        <div class="flight-list" id="flight-list-container"></div>
      </section>

      <!-- Selected Flight Telemetry Inspector -->
      <section id="flight-detail-view" class="panel-section hidden">
        <div class="panel-header">
          <div>
            <div class="detail-callsign-row">
              <h2 class="detail-callsign" id="detail-callsign">---</h2>
              <span class="detail-type-tag" id="detail-aircraft-type">---</span>
            </div>
            <p class="panel-subtitle" id="detail-airline">---</p>
          </div>
          <button type="button" class="icon-close-btn" id="close-detail-btn" aria-label="닫기">×</button>
        </div>

        <!-- Route Progress Banner -->
        <div class="route-banner" id="detail-route-banner">
          <div class="route-endpoint">
            <span class="route-iata" id="detail-origin">---</span>
            <span class="route-name" id="detail-origin-name">출발지</span>
          </div>
          <div class="route-line-wrap">
            <div class="route-progress-track">
              <div class="route-progress-fill" id="detail-progress-fill" style="width:0%"></div>
            </div>
            <span class="route-meta" id="detail-eta">---</span>
          </div>
          <div class="route-endpoint right">
            <span class="route-iata" id="detail-dest">---</span>
            <span class="route-name" id="detail-dest-name">도착지</span>
          </div>
        </div>

        <!-- Telemetry Grid -->
        <div class="telemetry-grid">
          <div class="telemetry-cell">
            <span class="tele-label">고도 (ALTITUDE)</span>
            <strong class="tele-value" id="detail-alt-ft">---</strong>
            <span class="tele-sub" id="detail-alt-m">---</span>
          </div>
          <div class="telemetry-cell">
            <span class="tele-label">대지속도 (SPEED)</span>
            <strong class="tele-value" id="detail-speed-kts">---</strong>
            <span class="tele-sub" id="detail-speed-kmh">---</span>
          </div>
          <div class="telemetry-cell">
            <span class="tele-label">방위각 (HEADING)</span>
            <strong class="tele-value" id="detail-heading">---</strong>
            <span class="tele-sub" id="detail-vrate">---</span>
          </div>
          <div class="telemetry-cell">
            <span class="tele-label">좌표 (LAT / LON)</span>
            <strong class="tele-value mono-sm" id="detail-coords">---</strong>
            <span class="tele-sub" id="detail-squawk">SQK ----</span>
          </div>
        </div>

        <!-- Altitude Profile Mini Visualization -->
        <div class="profile-box" id="detail-profile-box">
          <div class="profile-header">
            <span>비행 고도 프로파일</span>
            <span id="detail-aircraft-label" class="muted">---</span>
          </div>
          <svg id="altitude-profile-svg" viewBox="0 0 280 64" class="profile-svg" aria-hidden="true"></svg>
        </div>

        <!-- Metadata Footer -->
        <div class="meta-row">
          <span>ICAO24 <strong id="detail-icao">------</strong></span>
          <span>등록번호 <strong id="detail-reg">---</strong></span>
          <span>국적 <strong id="detail-country">---</strong></span>
        </div>

        <!-- Actions -->
        <div class="detail-actions">
          <button type="button" class="primary-btn" id="follow-flight-btn">카메라 추적</button>
          <button type="button" class="secondary-btn" id="center-flight-btn">위치 이동</button>
        </div>
      </section>
    </aside>

    <!-- Pointer Hover Tooltip -->
    <div class="hover-tooltip hidden" id="hover-tooltip" role="tooltip"></div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
